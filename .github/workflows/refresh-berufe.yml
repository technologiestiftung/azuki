name: Refresh BERUFENET data

on:
  schedule:
    # Quarterly. New Ausbildungsordnungen come into force on 1 August, so June
    # catches the published set and September the retirements that follow.
    - cron: "0 3 1 3,6,9,12 *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: data-refresh
  cancel-in-progress: false

jobs:
  # Runs npm install scripts, so it gets no write token.
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js using .nvmrc ⚙️
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies 📦
        run: npm ci

      - name: Fetch BERUFENET catalog 🌐
        run: npm run data:fetch-berufe

      # No --force: only records missing copy, so the free-text matching terms in
      # shared/src/matching/textMatching.ts stay stable. A failure still opens the
      # PR — the report lists what is missing.
      - name: Generate short descriptions 🤖
        run: npm run data:generate-short-descriptions
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Generate task bullets 🤖
        run: npm run data:generate-task-bullets
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Regenerate DAZUBI-derived data for the report 🔗
        run: npm run data:build-dazubi

      - name: Build refresh report 📋
        run: npx tsx scripts/report-data-refresh.ts > refresh-report.md

      - name: Upload refreshed data ⬆️
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data-refresh
          if-no-files-found: error
          retention-days: 7
          path: |
            backend/src/data/berufe.json
            shared/data/berufenet-meta.json
            refresh-report.md

  # Holds the write token, so it must never install or run project code.
  open-pr:
    needs: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@v4

      - name: Download refreshed data ⬇️
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: data-refresh

      - name: Open pull request 🚢
        id: cpr
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: chore/data-refresh
          base: main
          title: "chore(data): refresh BERUFENET catalog"
          body-path: refresh-report.md
          commit-message: "chore(data): refresh BERUFENET catalog"
          add-paths: |
            backend/src/data/berufe.json
            shared/data/berufenet-meta.json

      # Pushes and PRs made with GITHUB_TOKEN don't trigger workflows; a dispatch does.
      - name: Run CI on the pull request 🧪
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: gh workflow run pipeline.yml --ref chore/data-refresh --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ github.token }}
